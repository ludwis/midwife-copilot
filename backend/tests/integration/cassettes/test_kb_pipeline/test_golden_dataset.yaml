    body:
      string: "{\"candidates\": [{\"content\": {\"role\": \"model\", \"parts\": [{\"text\": \"[{\\\"question\\\": \\\"Czy normalne jest, że dziecko chce jeść co półtorej godziny? Ma 3 tygodnie.\\\", \\\"answer\\\": \\\"Tak, to całkowicie normalne. Żołądek noworodka jest bardzo mały i mleko matki jest łatwo strawne, więc niemowlę szybko się głodnieje. Karmienie co 1,5–2 godziny w tym wieku jest prawidłowe. Proszę karmić na żądanie.\\\"}, {\\\"question\\\": \\\"Jak długo powinno trwać karmienie z jednej piersi?\\\", \\\"answer\\\": \\\"Nie ma jednej zasady — dziecko samo sygnalizuje nasycenie. Przeciętnie 10–20 minut przy jednej piersi, ale niektóre dzieci pobierają mleko sprawniej i kończą w 7–8 minut. Ważne, żeby pierś była dobrze opróżniona przed przejściem na drugą.\\\"}, {\\\"question\\\": \\\"Pępek [IMIĘ_DZIECKA] trochę się zaczerwienił wokół. Czy powinnam coś z tym zrobić?\\\", \\\"answer\\\": \\\"Lekkie zaczerwienienie wokół kikuta pępka może być normalną reakcją podczas gojenia, ale wymaga obserwacji. Proszę sprawdzić, czy pojawia się wydzielina, nieprzyjemny zapach lub obrzęk. Jeśli tak — proszę bezzwłocznie zadzwonić. W przypadku samego zaczerwienienia proszę przemywać pępek gazikiem z wodą utlenioną raz dziennie i dbać o to, żeby był suchy i odkryty.\\\"}, {\\\"question\\\": \\\"[IMIĘ_DZIECKA] płakała całą noc. Czy to możliwe, że mam za mało pokarmu?\\\", \\\"answer\\\": \\\"Proszę się nie martwić, nocny płacz nie oznacza automatycznie niedoboru pokarmu. Proszę sprawdzić: czy pieluszki są mokre 6–8 razy na dobę? Czy [IMIĘ_DZIECKA] ma regularne stolce? Czy po karmieniu uspokaja się? Jeśli tak — pokarm jest wystarczający. Niedobór pokarmu jest znacznie rzadszy niż mamy sądzą.\\\"}, {\\\"question\\\": \\\"Pieluchy mokre, stolce są codziennie. Po karmieniu na chwilę zasypia, ale po godzinie znów płacze.\\\", \\\"answer\\\": \\\"To może być kolka lub potrzeba bliskości — oboje są typowe dla 3. tygodnia życia. Proszę spróbować noszenia w chuście po karmieniu. Kolka szczytuje zwykle między 4. a 6. tygodniem i potem stopniowo ustępuje. Jeśli sytuacja nie poprawi się po kilku dniach, porozmawiamy na wizycie.\\\"}, {\\\"question\\\": \\\"Czy po porodzie siłami natury mogę już ćwiczyć? Jak szybko można wrócić do aktywności?\\\", \\\"answer\\\": \\\"Ćwiczenia po porodzie naturalnym można zacząć stopniowo. Przez pierwsze 6 tygodni zalecam tylko ćwiczenia mięśni dna miednicy (Kegla) i delikatne spacery. Po 6 tygodniach, jeśli nie ma powikłań, można stopniowo wracać do umiarkowanej aktywności — pilates, joga, pływanie. Biegania i intensywnych ćwiczeń brzucha proszę unikać przez minimum 3 miesiące. Wszystko zależy od indywidualnego gojenia się krocza.\\\"}, {\\\"question\\\": \\\"Kiedy [IMIĘ_DZIECKA] powinna dostać pierwszą szczepionkę? Mam kartę szczepień z porodówki, ale nie wiem co dalej.\\\", \\\"answer\\\": \\\"Na karcie ze szpitala powinna być adnotacja o szczepieniu BCG (gruźlica) i WZW B, które są podawane jeszcze na oddziale. Kolejna wizyta szczepionkowa u pediatry powinna odbyć się w 6. tygodniu życia — to szczepienie DTP, Hib, IPV i PCV13. Proszę umówić się do pediatry już teraz, bo terminy bywają odległe. Przy wizycie przejrzę razem z Panią kartę szczepień.\\\"}, {\\\"question\\\": \\\"Ile witaminy D podawać niemowlęciu i od kiedy?\\\", \\\"answer\\\": \\\"Zgodnie z aktualnymi wytycznymi, każde niemowlę w Polsce powinno otrzymywać 400–500 IU witaminy D3 na dobę od pierwszych dni życia, niezależnie od sposobu karmienia. Krople lub roztwór podaje się codziennie. Jeśli [IMIĘ_DZIECKA] była urodzona przed 32. tygodniem, dawka może być wyższa — ale przy urodzeniu w terminie 400 IU to właściwa ilość. Na rynku dostępne są preparaty: Vigantoletten, Devikap, Baby Drops — wszystkie równie dobre.\\\"}]\"}]}, \"finishReason\": \"STOP\", \"index\": 0}], \"usageMetadata\": {\"promptTokenCount\": 500, \"candidatesTokenCount\": 800, \"totalTokenCount\": 1300}}"
