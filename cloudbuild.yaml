substitutions:
  _AUDIT_BUCKET_NAME: midwife-bot-audit-dev
  _KB_IMPORTS_BUCKET_NAME: midwife-copilot-kb-imports-dev

steps:
  # ---------------------------------------------------------------------------
  # Audit bucket — dev (CI-active)
  # Creates the dev GCS audit bucket on first run; subsequent runs are no-ops.
  # ---------------------------------------------------------------------------
  - id: create-audit-bucket-dev
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - gsutil mb -l europe-west1 gs://$_AUDIT_BUCKET_NAME || true

  # ---------------------------------------------------------------------------
  # PRODUCTION AUDIT BUCKET SETUP — DO NOT RUN IN CI
  # IRREVERSIBLE — run once on production project only
  #
  # Uncomment and execute manually with:
  #   gcloud builds submit --no-source --config cloudbuild.yaml \
  #     --substitutions _AUDIT_BUCKET_NAME=midwife-bot-audit-prod
  # (or run the gsutil commands directly in Cloud Shell)
  #
  # Steps:
  #  - id: create-audit-bucket-production
  #    name: gcr.io/google.com/cloudsdktool/cloud-sdk
  #    entrypoint: bash
  #    args:
  #      - -c
  #      - |
  #        gsutil mb -l europe-west1 gs://midwife-bot-audit-prod
  #        gsutil retention set 7y gs://midwife-bot-audit-prod
  #        gsutil retention lock gs://midwife-bot-audit-prod
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # KB imports bucket — dev (CI-active)
  # Creates the temporary-upload bucket; files auto-deleted after 7 days.
  # ---------------------------------------------------------------------------
  - id: create-kb-imports-bucket
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gsutil mb -l europe-west1 gs://$_KB_IMPORTS_BUCKET_NAME || true
        echo '{"rule":[{"action":{"type":"Delete"},"condition":{"age":7}}]}' | \
          gsutil lifecycle set /dev/stdin gs://$_KB_IMPORTS_BUCKET_NAME

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/stilla/backend:$COMMIT_SHA
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/stilla/backend:latest
      - --file
      - backend/Dockerfile
      - backend/

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - europe-west1-docker.pkg.dev/$PROJECT_ID/stilla/backend
    waitFor:
      - docker-build

  - id: cloud-run-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - stilla-backend
      - --image
      - europe-west1-docker.pkg.dev/$PROJECT_ID/stilla/backend:$COMMIT_SHA
      - --region
      - europe-west1
      - --platform
      - managed
      - --min-instances
      - "1"
      - --allow-unauthenticated
    waitFor:
      - docker-push

  # ---------------------------------------------------------------------------
  # Deploy Firebase Functions
  # ---------------------------------------------------------------------------
  - id: deploy-functions
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        firebase deploy --only functions --project $PROJECT_ID --non-interactive
    waitFor:
      - cloud-run-deploy

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/stilla/backend:$COMMIT_SHA
  - europe-west1-docker.pkg.dev/$PROJECT_ID/stilla/backend:latest

options:
  logging: CLOUD_LOGGING_ONLY
